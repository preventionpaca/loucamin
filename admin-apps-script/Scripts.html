<script>
const state={products:[],pages:[],pageBlocks:[],canEdit:false,pagesConfigured:false,licensesConfigured:false};
const byId=id=>document.getElementById(id);
function status(message){byId('status').textContent=message||'';}
function fail(error){
  byId('identity').textContent='Connexion Google refusée';
  status(error&&error.message?error.message:String(error||'Erreur inconnue.'));
}
function render(){
  const root=byId('products');root.replaceChildren();
  state.products.forEach(product=>{
    const card=document.createElement('article');card.className='product';
    const title=document.createElement('h3');title.textContent=product.titre;
    const description=document.createElement('p');description.textContent=product.description||'Sans description';
    const badge=document.createElement('span');badge.className='badge'+(product.visible?' visible':'');badge.textContent=product.visible?'Visible':'Masqué';
    card.append(title,description,badge);
    if(state.canEdit){const button=document.createElement('button');button.type='button';button.className='editButton';button.textContent='Modifier';button.addEventListener('click',()=>openEditor(product));card.append(button);}
    root.append(card);
  });
}
function licenseMessage(message,error=false){const node=byId('licenseStatus');node.textContent=message||'';node.classList.toggle('error',error);}
function renderLicenses(data){
  const metrics=byId('licenseMetrics');metrics.replaceChildren();[['Licences',data.licenses],['Postes actifs',data.active_installations],['Événements sur la période',data.events],['Conversions',data.conversions],['Téléchargements mesurés',data.downloads],['24 h / 7 j / 31 j',(data.periods?.day||0)+' / '+(data.periods?.week||0)+' / '+(data.periods?.month||0)]].forEach(item=>{const card=document.createElement('article');card.className='licenseMetric';const value=document.createElement('strong');value.textContent=String(item[1]||0);const label=document.createElement('span');label.textContent=item[0];card.append(value,label);metrics.append(card)});
  const rows=byId('licenseRows');rows.replaceChildren();(data.recent_licenses||[]).forEach(license=>{const row=document.createElement('tr');[license.key,license.email,license.status,license.created].forEach(value=>{const cell=document.createElement('td');cell.textContent=String(value||'');row.append(cell)});rows.append(row)});
  const modules=byId('moduleStats');modules.replaceChildren();Object.entries(data.modules||{}).sort((a,b)=>b[1]-a[1]).forEach(item=>{const line=document.createElement('div');const name=document.createElement('span');name.textContent=item[0];const count=document.createElement('strong');count.textContent=String(item[1]);line.append(name,count);modules.append(line)});if(!modules.children.length){const empty=document.createElement('p');empty.className='emptyNotice';empty.textContent='Aucune statistique consentie reçue pour le moment.';modules.append(empty)};
  const versions=byId('versionStats');versions.replaceChildren();Object.entries(data.versions||{}).sort((a,b)=>b[1]-a[1]).forEach(item=>{const line=document.createElement('div');const name=document.createElement('span');name.textContent=item[0];const count=document.createElement('strong');count.textContent=String(item[1]);line.append(name,count);versions.append(line)});if(!versions.children.length){const empty=document.createElement('p');empty.className='emptyNotice';empty.textContent='Aucune version enregistrée sur cette période.';versions.append(empty)};
  const timeline=byId('timelineRows');timeline.replaceChildren();(data.timeline||[]).forEach(item=>{const row=document.createElement('tr');[item.day,item.count].forEach(value=>{const cell=document.createElement('td');cell.textContent=String(value);row.append(cell)});timeline.append(row)});
}
function loadLicenses(){
  if(!state.licensesConfigured){licenseMessage('Les tables Licences, Installations et Statistiques doivent être ajoutées au document Grist existant.',true);return;}
  licenseMessage('Chargement…');byId('refreshLicenses').disabled=true;google.script.run.withSuccessHandler(data=>{byId('refreshLicenses').disabled=false;licenseMessage('');renderLicenses(data)}).withFailureHandler(error=>{byId('refreshLicenses').disabled=false;licenseMessage(error&&error.message?error.message:String(error),true)}).chargerLicencesEtStatistiques(byId('statisticsPeriod').value);
}
function openEditor(product={}){
  const form=byId('productForm');form.reset();
  for(const [key,value] of Object.entries(product)){if(form.elements[key]){if(form.elements[key].type==='checkbox')form.elements[key].checked=value===true;else form.elements[key].value=value??'';}}
  byId('editorTitle').textContent=product.id?'Modifier le produit':'Nouveau produit';
  byId('editor').hidden=false;form.elements.titre.focus();
}
function slugify(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,80);}
function pageMessage(message,error=false){const node=byId('pageStatus');node.textContent=message||'';node.classList.toggle('error',error);}
function renderPages(){
  const root=byId('sitePages');root.replaceChildren();
  if(!state.pages.length){const empty=document.createElement('p');empty.className='emptyNotice';empty.textContent='Aucune page personnalisée publiée pour le moment.';root.append(empty);return;}
  state.pages.forEach(page=>{
    const card=document.createElement('article');card.className='sitePage';if(page.published===false)card.classList.add('unpublished');const title=document.createElement('h3');title.textContent=page.title;const parent=state.pages.find(candidate=>candidate.slug===page.parentSlug);const meta=document.createElement('p');meta.textContent='Adresse : '+page.slug+' · '+(page.published===false?'Dépubliée':'Publiée')+(parent?' · Sous « '+parent.title+' »':' · Page principale');const actions=document.createElement('div');actions.className='sitePageActions';
    const edit=document.createElement('button');edit.type='button';edit.textContent='Modifier';edit.addEventListener('click',()=>loadPageContent(page.slug));
    const view=document.createElement('a');view.href='https://loucodi.fr/page.html?page='+encodeURIComponent(page.slug);view.target='_blank';view.rel='noopener';view.textContent='Voir la page';const visibility=document.createElement('button');visibility.type='button';visibility.className='secondary';visibility.textContent=page.published===false?'Republier':'Dépublier';visibility.addEventListener('click',()=>togglePage(page));const remove=document.createElement('button');remove.type='button';remove.className='danger';remove.textContent='Supprimer';remove.addEventListener('click',()=>deletePage(page));actions.append(edit,view,visibility,remove);card.append(title,meta,actions);root.append(card);
  });
}
function loadPages(){
  if(!state.canEdit||!state.pagesConfigured)return;
  google.script.run.withSuccessHandler(pages=>{state.pages=Array.isArray(pages)?pages:[];renderPages();}).withFailureHandler(error=>pageMessage(error&&error.message?error.message:String(error),true)).chargerPagesSite();
}
function openPageEditor(page={}){
  const form=byId('pageForm');form.reset();form.hidden=false;form.elements.title.value=page.title||'';form.elements.slug.value=page.slug||'';form.elements.introduction.value=page.introduction||'';form.elements.published.checked=page.published!==false;form.elements.slug.readOnly=Boolean(page.slug);const parentSelect=form.elements.parentSlug;parentSelect.replaceChildren();const none=document.createElement('option');none.value='';none.textContent='Aucune — page principale';parentSelect.append(none);state.pages.filter(candidate=>candidate.slug!==page.slug).forEach(candidate=>{const option=document.createElement('option');option.value=candidate.slug;option.textContent=candidate.title;parentSelect.append(option)});parentSelect.value=page.parentSlug||'';state.pageBlocks=Array.isArray(page.blocks)?page.blocks.map(block=>({...block})):[];pageMessage('');renderPageBlocks();form.elements.title.focus();form.scrollIntoView({behavior:'smooth',block:'start'});
}
function togglePage(page){const publish=page.published===false;if(!confirm((publish?'Republier':'Dépublier')+' la page « '+page.title+' » ?'))return;pageMessage('Mise à jour de la visibilité…');google.script.run.withSuccessHandler(loadPages).withFailureHandler(error=>pageMessage(error&&error.message?error.message:String(error),true)).changerPublicationPageSite(page.slug,publish);}
function deletePage(page){if(!confirm('Supprimer définitivement la page « '+page.title+' » ? Cette action retire son contenu public.'))return;pageMessage('Suppression en cours…');google.script.run.withSuccessHandler(()=>{if(byId('pageForm').elements.slug.value===page.slug)byId('pageForm').hidden=true;loadPages()}).withFailureHandler(error=>pageMessage(error&&error.message?error.message:String(error),true)).supprimerPageSite(page.slug);}
function loadPageContent(slug){pageMessage('Chargement de la page…');google.script.run.withSuccessHandler(openPageEditor).withFailureHandler(error=>pageMessage(error&&error.message?error.message:String(error),true)).chargerContenuPageSite(slug);}
function blockLabel(type){return type==='card'?'Vignette':type==='image'?'Image':'Texte';}
function formatSelection(control,before,after=before){const start=control.selectionStart||0;const end=control.selectionEnd||start;const selected=control.value.slice(start,end)||'texte';control.setRangeText(before+selected+after,start,end,'select');control.dispatchEvent(new Event('input',{bubbles:true}));control.focus();}
function richToolbar(control){const bar=document.createElement('span');bar.className='richToolbar';[['Gras','**','**'],['Italique','*','*'],['Liste','- ',''],['Lien','[texte](https://exemple.fr)','']].forEach(item=>{const button=document.createElement('button');button.type='button';button.textContent=item[0];button.addEventListener('click',()=>formatSelection(control,item[1],item[2]));bar.append(button)});return bar;}
function uploadImage(control){const picker=document.createElement('input');picker.type='file';picker.accept='image/png,image/jpeg,image/webp,image/gif';picker.hidden=true;picker.addEventListener('change',()=>{const file=picker.files&&picker.files[0];if(!file)return;if(file.size>4*1024*1024){pageMessage('Cette image dépasse 4 Mo.',true);return}pageMessage('Envoi de l’image…');const reader=new FileReader();reader.onload=()=>google.script.run.withSuccessHandler(result=>{control.value=result.path;control.dispatchEvent(new Event('input',{bubbles:true}));pageMessage('Image ajoutée au site. Elle sera visible après le déploiement GitHub Pages.')}).withFailureHandler(error=>pageMessage(error&&error.message?error.message:String(error),true)).publierMediaPageSite({name:file.name,mime:file.type,data:String(reader.result||'')});reader.onerror=()=>pageMessage('Impossible de lire ce fichier.',true);reader.readAsDataURL(file)});return picker;}
function field(label,name,value,options={}){
  const wrapper=document.createElement('label');wrapper.className=options.wide?'wide':'';wrapper.append(document.createTextNode(label));let control;
  if(options.kind==='textarea'){control=document.createElement('textarea');control.rows=options.rows||3;}else if(options.kind==='select'){control=document.createElement('select');[['full','Toute la largeur'],['half','Demi-largeur'],['third','Un tiers']].forEach(item=>{const option=document.createElement('option');option.value=item[0];option.textContent=item[1];control.append(option)});}else{control=document.createElement('input');control.type=options.kind||'text';}
  control.name=name;if(options.placeholder)control.placeholder=options.placeholder;if(options.kind==='checkbox')control.checked=value===true;else control.value=value??'';control.addEventListener('input',()=>{const index=Number(wrapper.closest('.pageBlock').dataset.index);state.pageBlocks[index][name]=control.type==='checkbox'?control.checked:control.value;renderPagePreview();});if(options.rich)wrapper.append(richToolbar(control));wrapper.append(control);if(options.media){const choose=document.createElement('button');choose.type='button';choose.className='mediaPicker';choose.textContent='Parcourir mon disque…';const picker=uploadImage(control);choose.addEventListener('click',()=>picker.click());wrapper.append(choose,picker)}return wrapper;
}
function renderPageBlocks(){
  const root=byId('pageBlocks');root.replaceChildren();state.pageBlocks.forEach((block,index)=>{
    const item=document.createElement('article');item.className='pageBlock';item.draggable=true;item.dataset.index=index;
    const handle=document.createElement('button');handle.type='button';handle.className='dragHandle';handle.title='Faire glisser pour réordonner';handle.textContent='☰ '+blockLabel(block.type);
    const fields=document.createElement('div');fields.className='blockFields';fields.append(field('Largeur sur ordinateur','width',block.width||'full',{kind:'select'}));
    if(block.type==='text'){fields.append(field('Titre','title',block.title),field('Contenu','content',block.content,{kind:'textarea',rows:5,wide:true,rich:true}));}
    if(block.type==='card'){fields.append(field('Titre','title',block.title),field('Petit logo (adresse web, assets/ ou fichier)','icon',block.icon,{media:true}),field('Contenu','content',block.content,{kind:'textarea',rows:5,wide:true,rich:true}),field('Dépliée dès l’ouverture','open',block.open,{kind:'checkbox',wide:true}));}
    if(block.type==='image'){fields.append(field('Image (adresse web, assets/ ou fichier)','src',block.src,{media:true}),field('Texte alternatif','alt',block.alt),field('Légende','caption',block.caption,{wide:true}));}
    const actions=document.createElement('div');actions.className='blockActions';const up=document.createElement('button');up.type='button';up.className='secondary';up.textContent='↑';up.disabled=index===0;up.addEventListener('click',()=>moveBlock(index,index-1));const down=document.createElement('button');down.type='button';down.className='secondary';down.textContent='↓';down.disabled=index===state.pageBlocks.length-1;down.addEventListener('click',()=>moveBlock(index,index+1));const remove=document.createElement('button');remove.type='button';remove.className='danger';remove.textContent='Supprimer';remove.addEventListener('click',()=>{state.pageBlocks.splice(index,1);renderPageBlocks()});actions.append(up,down,remove);item.append(handle,fields,actions);
    item.addEventListener('dragstart',event=>{item.classList.add('dragging');event.dataTransfer.setData('text/plain',String(index));event.dataTransfer.effectAllowed='move'});item.addEventListener('dragend',()=>item.classList.remove('dragging'));item.addEventListener('dragover',event=>{event.preventDefault();event.dataTransfer.dropEffect='move'});item.addEventListener('drop',event=>{event.preventDefault();const from=Number(event.dataTransfer.getData('text/plain'));if(Number.isInteger(from)&&from!==index)moveBlock(from,index)});root.append(item);
  });renderPagePreview();
}
function moveBlock(from,to){if(to<0||to>=state.pageBlocks.length)return;const moved=state.pageBlocks.splice(from,1)[0];state.pageBlocks.splice(to,0,moved);renderPageBlocks();}
function addBlock(type){const defaults={text:{type:'text',width:'full',title:'Nouveau titre',content:''},card:{type:'card',width:'third',title:'Nouvelle vignette',icon:'',content:'',open:false},image:{type:'image',width:'half',src:'',alt:'',caption:''}};state.pageBlocks.push({...defaults[type]});renderPageBlocks();}
function safePreviewImage(value){value=String(value||'').trim();if(/^https:\/\//i.test(value))return value;if(/^assets\/[A-Za-z0-9_./-]+$/.test(value)&&!value.includes('..'))return 'https://loucodi.fr/'+value;return '';}
function renderPagePreview(){
  const root=byId('pagePreview');root.replaceChildren();if(!state.pageBlocks.length){const empty=document.createElement('p');empty.className='emptyNotice';empty.textContent='Ajoutez un premier bloc pour afficher l’aperçu.';root.append(empty);return;}
  state.pageBlocks.forEach(block=>{const node=document.createElement('div');node.className='previewBlock'+(block.type==='card'?' previewCard':'');node.dataset.width=block.width||'full';if(block.type==='image'){const safeSrc=safePreviewImage(block.src);if(safeSrc){const image=document.createElement('img');image.src=safeSrc;image.alt='';node.append(image)}const caption=document.createElement('small');caption.textContent=block.caption||'Image';node.append(caption);}else{const title=document.createElement('strong');title.textContent=block.title||blockLabel(block.type);const body=document.createElement('small');body.textContent=block.type==='card'&&!block.open?'Contenu replié par défaut':(block.content||'Sans contenu');node.append(title,body)}root.append(node)});
}
function load(){
  status('Chargement…');
  google.script.run.withSuccessHandler(data=>{state.products=data.produits;state.canEdit=data.administrateur.peutModifier;state.pagesConfigured=data.publicationPagesConfiguree===true;state.licensesConfigured=data.licencesConfigurees===true;byId('identity').textContent=data.administrateur.nom+' — '+data.administrateur.email;byId('newProduct').hidden=!state.canEdit;byId('newPage').hidden=!state.canEdit;byId('newPage').disabled=!state.pagesConfigured;byId('publishLayout').hidden=!state.canEdit;byId('publishLayout').disabled=!data.publicationAccueilConfiguree;byId('refreshLicenses').disabled=!state.licensesConfigured;byId('publicationHelp').textContent=data.publicationAccueilConfiguree?'La publication crée une modification traçable dans le dépôt du site.':'La liaison de publication GitHub doit être configurée dans les propriétés sécurisées de l’administration.';status('');render();renderPages();loadPages();loadLicenses();}).withFailureHandler(fail).chargerAdministration();
}
byId('refreshLicenses').addEventListener('click',loadLicenses);
byId('statisticsPeriod').addEventListener('change',loadLicenses);
byId('newProduct').addEventListener('click',()=>openEditor());
byId('cancel').addEventListener('click',()=>{byId('editor').hidden=true;});
byId('productForm').addEventListener('submit',event=>{
  event.preventDefault();const form=event.currentTarget;const payload=Object.fromEntries(new FormData(form));payload.visible=form.elements.visible.checked;payload.id=Number(payload.id||0);payload.ordre=Number(payload.ordre||0);status('Enregistrement…');
  google.script.run.withSuccessHandler(()=>{byId('editor').hidden=true;load();}).withFailureHandler(fail).enregistrerProduit(payload);
});
byId('newPage').addEventListener('click',()=>openPageEditor());
byId('cancelPage').addEventListener('click',()=>{byId('pageForm').hidden=true;});
document.querySelectorAll('[data-add-block]').forEach(button=>button.addEventListener('click',()=>addBlock(button.dataset.addBlock)));
byId('introductionToolbar').append(richToolbar(byId('pageForm').elements.introduction));
byId('pageForm').elements.title.addEventListener('input',event=>{const slug=byId('pageForm').elements.slug;if(!slug.readOnly)slug.value=slugify(event.target.value)});
byId('pageForm').addEventListener('submit',event=>{
  event.preventDefault();const form=event.currentTarget;const titleInput=form.querySelector('[name="title"]');const slugInput=form.querySelector('[name="slug"]');const introductionInput=form.querySelector('[name="introduction"]');const publishedInput=form.querySelector('[name="published"]');const payload={title:String(titleInput&&titleInput.value||'').trim(),slug:String(slugInput&&slugInput.value||'').trim(),parentSlug:String(form.elements.parentSlug.value||''),introduction:String(introductionInput&&introductionInput.value||''),published:Boolean(publishedInput&&publishedInput.checked),blocks:state.pageBlocks};if(!payload.title){pageMessage('Saisissez un titre de page.',true);titleInput&&titleInput.focus();return}if(!payload.slug){pageMessage('Saisissez un identifiant dans l’adresse.',true);slugInput&&slugInput.focus();return}if(!confirm('Enregistrer la page « '+payload.title+' » sur le site ?'))return;pageMessage('Publication en cours…');byId('publishPage').disabled=true;
  google.script.run.withSuccessHandler(result=>{byId('publishPage').disabled=false;pageMessage('Page publiée. GitHub Pages va l’actualiser dans quelques instants.');loadPages();if(result.url){const link=document.createElement('a');link.href=result.url;link.target='_blank';link.rel='noopener';link.textContent=' Ouvrir la page';byId('pageStatus').append(link)}}).withFailureHandler(error=>{byId('publishPage').disabled=false;pageMessage(error&&error.message?error.message:String(error),true)}).publierPageSite(JSON.stringify(payload));
});
byId('publishLayout').addEventListener('click',()=>{
  const publicationStatus=byId('publicationStatus');
  publicationStatus.classList.remove('error');
  const raw=byId('layoutPayload').value.trim();
  if(!raw){publicationStatus.textContent='Collez d’abord les réglages copiés depuis l’atelier.';publicationStatus.classList.add('error');return;}
  let payload;
  try{payload=JSON.parse(raw);}catch(error){
    try{payload=JSON.parse('['+raw.replace(/}\s*{/g,'},{')+']');}
    catch(secondError){publicationStatus.textContent='Les réglages collés ne sont pas un JSON valide.';publicationStatus.classList.add('error');return;}
  }
  const payloads=Array.isArray(payload)?payload:[payload];
  if(!payloads.length){publicationStatus.textContent='Aucun réglage à publier.';publicationStatus.classList.add('error');return;}
  if(!confirm('Publier les réglages de '+payloads.length+' fond'+(payloads.length>1?'s':'')+' sur le site ?'))return;
  publicationStatus.textContent='Publication en cours…';
  byId('publishLayout').disabled=true;
  google.script.run.withSuccessHandler(result=>{const count=Number(result.nombre||payloads.length);publicationStatus.textContent=count+' fond'+(count>1?'s':'')+' publié'+(count>1?'s':'')+'. Le site sera actualisé après le déploiement GitHub Pages.';byId('layoutPayload').value='';byId('publishLayout').disabled=false;}).withFailureHandler(error=>{byId('publishLayout').disabled=false;publicationStatus.textContent=error&&error.message?error.message:String(error||'Erreur inconnue.');publicationStatus.classList.add('error');}).publierReglageAccueil(payloads);
});
load();
</script>
