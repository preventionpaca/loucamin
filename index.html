<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Lou Camin — Club de programmation. Applications et utilitaires pour la formation et la prévention des risques professionnels.">
<title>Lou Camin — Club de programmation</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06325b;font-family:Arial,sans-serif}
.page{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#06325b}
.visual{position:relative;width:min(100vw,calc(100vh * 1672 / 941));height:min(100vh,calc(100vw * 941 / 1672))}
.visual img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.footer-actions{
  position:absolute;right:2.8%;bottom:1.8%;height:7.2%;
  display:flex;align-items:center;gap:10px;z-index:3
}
.footer-link{
  display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none;
  font-weight:700;font-size:clamp(12px,1.05vw,18px);
  padding:9px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.22);
  background:rgba(3,38,74,.28);backdrop-filter:blur(2px);cursor:pointer
}
.footer-link:hover{background:rgba(255,255,255,.12)}
.footer-link svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.modal{position:fixed;inset:0;background:rgba(3,25,47,.64);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.open{display:flex}
.dialog{width:min(560px,96vw);background:#fff;border-radius:18px;box-shadow:0 25px 80px rgba(0,0,0,.35);padding:24px;color:#17324d;position:relative}
.dialog h2{margin:0 0 5px;color:#9e1021;font-size:1.7rem}
.dialog p{margin:0 0 18px;color:#617180;font-size:.94rem}
.close{position:absolute;right:15px;top:12px;border:0;background:transparent;font-size:28px;cursor:pointer;color:#526474}
form{display:grid;gap:12px}
label{font-weight:700;font-size:.9rem}
input,textarea{width:100%;padding:11px 12px;border:1px solid #bdcad4;border-radius:9px;font:inherit}
textarea{min-height:125px;resize:vertical}
.send{border:0;border-radius:10px;padding:12px 16px;background:#9e1021;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
.note{font-size:.78rem!important;margin-top:3px!important;color:#71808d!important}
@media(max-width:650px){.footer-actions{right:1.5%;gap:4px}.footer-link{padding:7px 8px}.footer-link svg{width:16px}}
</style>
</head>
<body>
<main class="page">
  <div class="visual">
    <img src="assets/accueil-lou-camin.png" alt="Lou Camin — Club de programmation, Occitanie Côte d’Azur">
    <div class="footer-actions" aria-label="Navigation">
      <a class="footer-link" href="projets.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h7l2 2h9v10H3z"/><path d="M3 7V5h7l2 2"/></svg>
        Projets
      </a>
      <button class="footer-link" id="openContact" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
        Contact
      </button>
    </div>
  </div>
</main>

<div class="modal" id="contactModal" role="dialog" aria-modal="true" aria-labelledby="contactTitle">
  <div class="dialog">
    <button class="close" id="closeContact" aria-label="Fermer">×</button>
    <h2 id="contactTitle">Contact</h2>
    <p>Une question, une idée ou un besoin autour de la formation ou de la prévention des risques ?</p>
    <form id="contactForm">
      <div><label for="name">Nom</label><input id="name" name="name" required></div>
      <div><label for="email">Adresse e-mail</label><input id="email" name="email" type="email" required></div>
      <div><label for="subject">Objet</label><input id="subject" name="subject" required></div>
      <div><label for="message">Message</label><textarea id="message" name="message" required></textarea></div>
      <button class="send" type="submit">Envoyer le message</button>
    </form>
  </div>
</div>

<script>
const modal=document.getElementById('contactModal');
document.getElementById('openContact').addEventListener('click',()=>modal.classList.add('open'));
document.getElementById('closeContact').addEventListener('click',()=>modal.classList.remove('open'));
modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('open')});
document.getElementById('contactForm').addEventListener('submit',e=>{
  e.preventDefault();
  alert("Le formulaire est prêt. Il reste à raccorder l’envoi direct à rudy.themines@gmail.com sans ouvrir le logiciel de messagerie.");
});
</script>
</body>
</html>
