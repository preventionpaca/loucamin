<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page — Lou Còdi</title>
<style>
:root{--navy:#05265c;--red:#c30b17;--gold:#ffd600;--ink:#102a43;--muted:#52677c;--paper:#f5f8fa}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#d9f5fb 0,#edf6fa 34%,#f7f9fa 75%);color:var(--ink);font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(115deg,#05265c 0%,#087fb8 50%,#12bea8 100%);color:#fff;padding:9px 5vw;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:4px solid var(--gold);box-shadow:0 10px 30px #04214a2e}
.brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none}.brand img{width:68px;height:68px;object-fit:contain}.brand-copy{line-height:1}.brand-name{font-family:"Brush Script MT","Segoe Script",cursive;font-size:2.35rem;font-style:italic;font-weight:800}.brand-name::after{content:"";display:block;height:4px;margin:4px 0 6px;border-radius:99px;background:var(--gold);transform:skewX(-25deg) rotate(-2deg)}.brand-subtitle{font-size:.77rem;font-weight:800;letter-spacing:.04em}.brand-region{display:block;margin-top:3px;font-size:.55rem;letter-spacing:.22em}
.header-navigation{display:grid;justify-items:end;gap:9px}.page-menu{position:relative;color:#fff}.page-menu summary{cursor:pointer;font-weight:800;list-style:none}.page-menu summary::-webkit-details-marker{display:none}.page-menu summary::after{content:" ▾"}.page-menu-panel{position:absolute;z-index:20;right:0;top:calc(100% + 8px);min-width:250px;padding:10px;background:#fff;border-radius:12px;box-shadow:0 14px 34px #03204442;display:grid;gap:5px}.page-menu-panel a{color:var(--navy);padding:7px 9px;border-radius:7px}.page-menu-panel .nested{padding-left:22px;font-size:.93rem}.page-menu-panel .nested::before{content:"↳ ";color:var(--red)}.breadcrumb{display:flex;justify-content:flex-end;align-items:center;gap:7px;flex-wrap:wrap;text-align:right;font-weight:800;font-size:.9rem}.breadcrumb a{color:#fff}.breadcrumb span[aria-current]{color:#fff;background:#ffffff20;border:1px solid #ffffff55;border-radius:999px;padding:7px 10px}
main{width:min(1180px,92vw);margin:30px auto 48px;flex:1}.intro{text-align:center;max-width:820px;margin:0 auto 28px}.intro h1{color:var(--red);font-size:2.1rem;margin:0 0 9px}.intro p{line-height:1.55;margin:0;color:var(--muted)}
.blocks{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:22px;align-items:start}.block{grid-column:span 12;min-width:0}.block[data-width="half"]{grid-column:span 6}.block[data-width="third"]{grid-column:span 4}
.text-block,.image-block,.card{background:rgba(255,255,255,.9);border:1px solid #fff;border-radius:18px;box-shadow:0 15px 38px #06325b20;backdrop-filter:blur(9px);overflow:hidden}.text-block{padding:22px}.text-block h2{color:var(--navy);margin:0 0 10px}.rich-text{white-space:pre-wrap;line-height:1.58;color:#314b60}
.image-block img{display:block;width:100%;max-height:620px;object-fit:cover}.image-block figcaption{padding:12px 16px;color:var(--muted);font-size:.9rem}.rich-text p{margin:.35em 0 .85em}.rich-text ul,.rich-text ol{padding-left:1.5em}.rich-text a{color:#075f9b;font-weight:700}
.card summary{list-style:none;display:flex;align-items:center;gap:13px;padding:18px 20px;cursor:pointer;color:var(--navy);font-size:1.08rem;font-weight:800}.card summary::-webkit-details-marker{display:none}.card summary::after{content:"⌄";margin-left:auto;font-size:1.5rem;line-height:1;transition:transform .18s ease}.card[open] summary::after{transform:rotate(180deg)}.card-icon{width:46px;height:46px;border-radius:50%;object-fit:contain;background:#e6f6f1;padding:6px;flex:0 0 auto}.card-body{border-top:3px solid var(--gold);margin:0 20px 20px;padding:14px 0 0;white-space:pre-wrap;line-height:1.55;color:#314b60}
.empty,.error{padding:28px;background:#fff;border-radius:16px;text-align:center}.error{color:#9e1021}
footer{background:var(--navy);color:#fff;padding:13px 5vw;display:flex;justify-content:space-between;gap:16px;align-items:center;font-size:.88rem}footer a{color:#fff;font-weight:700;text-decoration:none}
@media(max-width:760px){header{padding:10px 14px;align-items:flex-start;flex-direction:column;gap:10px}.brand img{width:54px;height:54px}.brand-name{font-size:1.9rem}.brand-subtitle{font-size:.7rem}.brand-region{font-size:.48rem;letter-spacing:.15em}.breadcrumb{width:100%;justify-content:flex-start;text-align:left;overflow-x:auto;flex-wrap:nowrap;padding:3px 0}.breadcrumb>*{flex:0 0 auto}main{width:calc(100% - 24px);margin:20px auto 30px}.intro h1{font-size:1.7rem}.blocks{display:block}.block{margin-bottom:16px}.text-block{padding:17px}.card summary{padding:15px}.card-body{margin:0 15px 16px}footer{flex-direction:column;text-align:center;padding:16px 14px}}
</style>
</head>
<body>
<header>
  <a class="brand" href="index.html" aria-label="Lou Còdi — Accueil"><img src="assets/logo-rond-lou-codi.png" alt=""><span class="brand-copy"><span class="brand-name">Lou Còdi</span><span class="brand-subtitle">Club de programmation<span class="brand-region">OCCITANIE · CÔTE D’AZUR</span></span></span></a>
  <div class="header-navigation"><details class="page-menu"><summary>Menu des pages</summary><div class="page-menu-panel" id="pageMenu"><a href="pages.html">Toutes les pages</a></div></details><nav class="breadcrumb" id="breadcrumb" aria-label="Fil d’Ariane"><a href="index.html">Accueil</a><span>›</span><span id="crumb" aria-current="page">Page</span></nav></div>
</header>
<main id="main"><p class="empty">Chargement de la page…</p></main>
<footer><span><strong>Lou Còdi</strong> · Projet indépendant</span><a href="pages.html">← Retour aux pages</a></footer>
<script>
const main=document.getElementById('main');
const slug=(new URLSearchParams(location.search).get('page')||'').toLowerCase();
const allowedUrl=value=>{if(!value)return '';try{const url=new URL(String(value),location.href);return url.protocol==='https:'||url.origin===location.origin?url.href:''}catch(error){return ''}};
const text=(tag,value,className)=>{const node=document.createElement(tag);node.textContent=value||'';if(className)node.className=className;return node};
function appendInline(parent,value){
  const source=String(value||'');const pattern=/(\*\*[^*]+\*\*|\*[^*]+\*|\[[^\]]+\]\(https:\/\/[^)\s]+\))/g;let last=0;for(const match of source.matchAll(pattern)){parent.append(document.createTextNode(source.slice(last,match.index)));const token=match[0];if(token.startsWith('**'))parent.append(text('strong',token.slice(2,-2)));else if(token.startsWith('*'))parent.append(text('em',token.slice(1,-1)));else{const parts=token.match(/^\[([^\]]+)\]\((https:\/\/[^)\s]+)\)$/);const link=document.createElement('a');link.textContent=parts[1];link.href=parts[2];link.target='_blank';link.rel='noopener';parent.append(link)}last=match.index+token.length}parent.append(document.createTextNode(source.slice(last)));
}
function rich(value,className='rich-text'){
  const root=document.createElement('div');root.className=className;let list=null;String(value||'').split(/\r?\n/).forEach(line=>{const item=line.match(/^\s*([-*]|\d+\.)\s+(.+)$/);if(item){const kind=/\d/.test(item[1])?'ol':'ul';if(!list||list.tagName.toLowerCase()!==kind){list=document.createElement(kind);root.append(list)}const li=document.createElement('li');appendInline(li,item[2]);list.append(li);return}list=null;if(!line.trim()){root.append(document.createElement('br'));return}const p=document.createElement('p');appendInline(p,line);root.append(p)});return root;
}
function renderBlock(block){
  const wrapper=document.createElement('section');wrapper.className='block';wrapper.dataset.width=['full','half','third'].includes(block.width)?block.width:'full';
  if(block.type==='text'){
    const article=document.createElement('article');article.className='text-block';if(block.title)article.append(text('h2',block.title));article.append(rich(block.content));wrapper.append(article);
  }else if(block.type==='image'){
    const src=allowedUrl(block.src);if(!src)return null;const figure=document.createElement('figure');figure.className='image-block';const image=document.createElement('img');image.src=src;image.alt=block.alt||'';image.loading='lazy';figure.append(image);if(block.caption)figure.append(text('figcaption',block.caption));wrapper.append(figure);
  }else if(block.type==='card'){
    const details=document.createElement('details');details.className='card';details.open=block.open===true;const summary=document.createElement('summary');const icon=allowedUrl(block.icon);if(icon){const image=document.createElement('img');image.className='card-icon';image.src=icon;image.alt='';summary.append(image)}summary.append(text('span',block.title||'Vignette'));details.append(summary,rich(block.content,'card-body rich-text'));wrapper.append(details);
  }else{return null}return wrapper;
}
function renderPage(page){
  document.title=(page.title||'Page')+' — Lou Còdi';document.getElementById('crumb').textContent=page.title||'Page';main.replaceChildren();
  if(page.published===false)throw new Error('Page dépubliée');const intro=document.createElement('section');intro.className='intro';intro.append(text('h1',page.title||'Sans titre'));if(page.introduction)intro.append(rich(page.introduction));main.append(intro);
  const blocks=document.createElement('div');blocks.className='blocks';(Array.isArray(page.blocks)?page.blocks:[]).forEach(block=>{const node=renderBlock(block||{});if(node)blocks.append(node)});main.append(blocks);if(!blocks.children.length)blocks.append(text('p','Cette page ne contient encore aucun bloc.','empty'));
}
function renderBreadcrumb(page,index){const nav=document.getElementById('breadcrumb');const bySlug=new Map((Array.isArray(index&&index.pages)?index.pages:[]).map(item=>[item.slug,item]));const chain=[];let current=page;const seen=new Set();while(current&&current.parentSlug&&!seen.has(current.parentSlug)){seen.add(current.parentSlug);const parent=bySlug.get(current.parentSlug);if(!parent)break;chain.unshift(parent);current=parent}nav.replaceChildren();const home=text('a','Accueil');home.href='index.html';nav.append(home);chain.forEach(parent=>{nav.append(text('span','›'));const link=text('a',parent.title);link.href='page.html?page='+encodeURIComponent(parent.slug);nav.append(link)});nav.append(text('span','›'));const currentNode=text('span',page.title||'Page');currentNode.id='crumb';currentNode.setAttribute('aria-current','page');nav.append(currentNode)}
function renderPageMenu(index){const menu=document.getElementById('pageMenu');const pages=(Array.isArray(index&&index.pages)?index.pages:[]).filter(page=>page&&page.published!==false&&page.slug&&page.title);const byParent=new Map();pages.forEach(page=>{const key=page.parentSlug||'';if(!byParent.has(key))byParent.set(key,[]);byParent.get(key).push(page)});const append=(parentSlug,depth=0,seen=new Set())=>{if(seen.has(parentSlug))return;const nextSeen=new Set(seen);nextSeen.add(parentSlug);(byParent.get(parentSlug)||[]).forEach(page=>{const link=text('a',page.title);if(depth)link.className='nested';link.href='page.html?page='+encodeURIComponent(page.slug);menu.append(link);append(page.slug,depth+1,nextSeen)})};append('')}
if(!/^[a-z0-9][a-z0-9-]{0,79}$/.test(slug)){main.innerHTML='<p class="error">Adresse de page invalide.</p>'}else Promise.all([fetch('assets/pages/'+slug+'.json',{cache:'no-store'}).then(response=>{if(!response.ok)throw new Error('Page introuvable');return response.json()}),fetch('assets/pages/index.json',{cache:'no-store'}).then(response=>response.ok?response.json():({pages:[]})).catch(()=>({pages:[]}))]).then(([page,index])=>{renderPage(page);renderBreadcrumb(page,index);renderPageMenu(index)}).catch(()=>{main.innerHTML='<p class="error">Cette page est introuvable ou n’est pas encore publiée.</p>'});
</script>
</body>
</html>
